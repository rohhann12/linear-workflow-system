name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  orchestrator:
    name: Build orchestrator service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/orchestrator/package-lock.json
      - run: npm install
        working-directory: services/orchestrator
      - run: node --check server.js pipeline.js sessions.js agents.js linear.js exec.js
        working-directory: services/orchestrator

  web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
