<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jerry</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; }
  #landing { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 24px; }
  #landing .logo { font-size: 64px; }
  #landing h1 { font-size: 30px; margin: 0; }
  #landing p { color: #8b949e; margin: 0; max-width: 460px; line-height: 1.5; }
  #landing .stats { display: flex; gap: 28px; margin: 6px 0; }
  #landing .stat { text-align: center; }
  #landing .stat .n { font-size: 28px; font-weight: 700; }
  #landing .stat .l { font-size: 12px; color: #8b949e; }
  #enterBtn { padding: 12px 28px; border-radius: 8px; border: none; background: #238636; color: white; font-size: 15px; cursor: pointer; }
  #enterBtn:hover { background: #2ea043; }
  #app { display: none; height: 100vh; }
  #app.visible { display: flex; }
  #sidebar { width: 260px; border-right: 1px solid #21262d; display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; padding: 14px; margin: 0; border-bottom: 1px solid #21262d; }
  #sessionList { flex: 1; overflow-y: auto; }
  .session-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #161b22; font-size: 13px; }
  .session-item:hover { background: #161b22; }
  .session-item.active { background: #1f2937; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; margin-left: 6px; }
  .badge.idle { background: #30363d; color: #8b949e; }
  .badge.running { background: #1f6feb; color: white; }
  .badge.queued { background: #9e6a03; color: white; }
  #newSessionBtn { margin: 10px; padding: 8px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; border-radius: 6px; cursor: pointer; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #header { padding: 14px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 10px; }
  #transcript { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #1f6feb; color: white; }
  .msg.jerry { align-self: flex-start; background: #21262d; }
  #logPanel { height: 200px; border-top: 1px solid #21262d; background: #010409; font-family: ui-monospace, monospace; font-size: 12px; overflow-y: auto; padding: 8px 12px; }
  #logPanel .line { white-space: pre-wrap; word-break: break-all; }
  #logPanel .error { color: #f85149; }
  #logPanel .warn { color: #d29922; }
  #composeRow { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #21262d; }
  #composeInput { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; }
  #composeRow button { padding: 10px 16px; border-radius: 6px; border: none; background: #238636; color: white; cursor: pointer; }
  #empty { margin: auto; color: #8b949e; }
</style>
</head>
<body>
  <div id="landing">
    <div class="logo">🐺</div>
    <h1>Welcome to Jerry's work</h1>
    <p>Tag Jerry on a Linear ticket, or start a chat below, and it clones the repo, writes the code, runs it for real, and opens a PR — screenshot included.</p>
    <div class="stats" id="landingStats"></div>
    <button id="enterBtn">Enter →</button>
  </div>
  <div id="app">
    <div id="sidebar">
      <h1>🐺 Jerry</h1>
      <button id="newSessionBtn">+ New session</button>
      <div id="sessionList"></div>
    </div>
    <div id="main">
      <div id="empty">Select or create a session to talk to Jerry.</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
